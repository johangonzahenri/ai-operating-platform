# AI Operating Platform — Production Nginx Reverse Proxy Configuration
# Initiative: AOP-NETWORK (Phase 55 / Prompt 101)

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Perimeter Rate Limiting Zone: 50 requests/second per client IP
    limit_req_zone $binary_remote_addr zone=platform_api_zone:10m rate=50r/s;
    limit_req_status 429;

    # Upstream definition for Platform Server running on Node.js
    upstream platform_backend {
        server platform:3000;
        keepalive 32;
    }

    # HTTP Redirect Server (Port 80 -> Port 443)
    server {
        listen 80;
        listen [::]:80;
        server_name platform.ai-operating-system.internal localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Production Gateway (Port 443)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name platform.ai-operating-system.internal localhost;

        # TLS Certificates & Cipher Hardening (A+ Security Profile)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern TLS configurations
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Strict Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

        # Client body limit matching platform specification (1MB max payload)
        client_max_body_size 1M;

        # API Routes with Rate Limiting and Upstream Proxying
        location /api/ {
            limit_req zone=platform_api_zone burst=30 nodelay;

            proxy_pass http://platform_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";

            # Disable proxy buffering for Real-time Server-Sent Events (SSE) & streaming
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # Healthcheck endpoint bypasses rate limiting for orchestrators/probes
        location /api/v1/health {
            proxy_pass http://platform_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static Web Console Assets
        location / {
            proxy_pass http://platform_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
