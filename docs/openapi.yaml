components:
  schemas:
    SparePartsSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Natural language or structured query for automotive spare parts
        vehicle:
          $ref: '#/components/schemas/VehicleSearchInput'
        options:
          type: object
          properties:
            comparisonCurrency: { type: string }
            requestedQuantity: { type: integer }
            targetDestinationCountry: { type: string }
            targetDestinationRegion: { type: string }
            maxBudgetMs: { type: integer }
            allowedSources:
              type: array
              items: { type: string }

    VehicleSearchInput:
      type: object
      required: [make, model, year]
      properties:
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        generation: { type: string }
        engine: { type: string }
        market: { type: string }

    SparePartsSearchResponse:
      type: object
      required: [searchId, queryText, status, executionTimeMs, totalOffersFound, clustersCount, clusters]
      properties:
        searchId: { type: string }
        queryText: { type: string }
        targetVehicle: { type: object }
        status:
          type: string
          enum: [SUCCESS, PARTIAL_SUCCESS, NO_RESULTS, FAILED]
        executionTimeMs: { type: number }
        sourceReports:
          type: array
          items:
            $ref: '#/components/schemas/SourceExecutionReport'
        totalOffersFound: { type: integer }
        clustersCount: { type: integer }
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/SparePartsSearchCluster'
        warnings:
          type: array
          items: { type: string }

    SourceExecutionReport:
      type: object
      required: [sourceId, sourceName, status, latencyMs, offersFound]
      properties:
        sourceId: { type: string }
        sourceName: { type: string }
        status:
          type: string
          enum: [SUCCESS, DEGRADED, TIMEOUT, ERROR]
        latencyMs: { type: number }
        offersFound: { type: integer }
        error: { type: string }

    SparePartsSearchCluster:
      type: object
      required: [clusterId, canonicalPartNumber, canonicalBrand, description, offerCount, comparison]
      properties:
        clusterId: { type: string }
        canonicalPartNumber: { type: string }
        canonicalBrand: { type: string }
        description: { type: string }
        offerCount: { type: integer }
        comparison:
          $ref: '#/components/schemas/TransparentPriceComparison'
        fitmentResult:
          $ref: '#/components/schemas/FitmentVerificationResult'

    TransparentPriceComparison:
      type: object
      required: [currency, items]
      properties:
        currency: { type: string }
        bestBasePrice: { type: object }
        bestTotalCost: { type: object }
        highestTrustSeller: { type: object }
        recommendedOffer: { type: object }
        priceSpread: { type: object }
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceComparisonOfferItem'

    PriceComparisonOfferItem:
      type: object
      required: [sourceId, sellerName, sellerTrust, basePrice, totalCost]
      properties:
        sourceId: { type: string }
        sellerName: { type: string }
        sellerTrust:
          type: object
          properties:
            score: { type: number }
            ratingCount: { type: integer }
            verified: { type: boolean }
        basePrice:
          type: object
          properties:
            amount: { type: number }
            currency: { type: string }
        shippingCost:
          type: object
          properties:
            amount: { type: number }
            currency: { type: string }
        totalCost:
          type: object
          properties:
            amount: { type: number }
            currency: { type: string }
        availability: { type: string }
        deliveryDaysEstimated: { type: integer }
        productUrl: { type: string }

    FitmentVerificationResult:
      type: object
      required: [verdict, confidence]
      properties:
        verdict:
          type: string
          enum: [FIT, NOT_FIT, UNKNOWN, CONFLICT]
        confidence: { type: number }
        reasons:
          type: array
          items: { type: string }
        verifiedOemNumbers:
          type: array
          items: { type: string }

    PlatformStatus:
      type: object
      required: [status, uptime, version, coreEngine, storage]
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY] }
        uptime: { type: number }
        version: { type: string }
        coreEngine: { type: string }
        storage: { type: string }

    PlatformHealth:
      type: object
      required: [status, components, timestamp]
      properties:
        status: { type: string, enum: [UP, DOWN, DEGRADED] }
        components:
          type: object
        timestamp: { type: string, format: date-time }

    ProbeResult:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, enum: [UP, DOWN] }
        timestamp: { type: string, format: date-time }

    PlatformMetadata:
      type: object
      required: [version, environment, capabilities]
      properties:
        version: { type: string }
        environment: { type: string }
        capabilities:
          type: array
          items: { type: string }

    PlatformCapability:
      type: object
      required: [id, name, category, riskTier, requiredPlan]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        riskTier: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        requiredPlan: { type: string, enum: [FREE, PRO, BUSINESS, ENTERPRISE] }

    Tool:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }

    Model:
      type: object
      required: [id, provider, name, status, capabilities]
      properties:
        id: { type: string }
        provider: { type: string }
        name: { type: string }
        status: { type: string, enum: [connected, available, unavailable] }
        capabilities:
          type: array
          items: { type: string }

    Agent:
      type: object
      required: [id, name, description, version, status, model]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        model: { type: string }
        allowedTools:
          type: array
          items: { type: string }

    CreateAgentRequest:
      type: object
      required: [id, name, description, model]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        model: { type: string }
        allowedTools:
          type: array
          items: { type: string }

    UpdateAgentRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        model: { type: string }
        allowedTools:
          type: array
          items: { type: string }

    AgentProfile:
      type: object
      required: [agentId, version, state, capabilities]
      properties:
        agentId: { type: string }
        version: { type: integer }
        state: { type: string }
        capabilities:
          type: array
          items: { type: object }

    CreateAgentProfileRequest:
      type: object
      required: [name, role, domain]
      properties:
        name: { type: string }
        role: { type: string }
        domain: { type: string }

    AddCapabilityRequest:
      type: object
      required: [capabilityId, level]
      properties:
        capabilityId: { type: string }
        level: { type: string }

    AgentLifecycle:
      type: object
      required: [agentId, state, version]
      properties:
        agentId: { type: string }
        state: { type: string, enum: [PROPOSED, ONBOARDING, QUALIFIED, ACTIVE, PROBATION, SUSPENDED, DEPRECATED, RETIRED, REVOKED] }
        version: { type: integer }

    TransitionLifecycleRequest:
      type: object
      required: [targetState, reason]
      properties:
        targetState: { type: string }
        reason: { type: string }

    AgentEvaluation:
      type: object
      required: [id, agentId, type, verdict, score]
      properties:
        id: { type: string }
        agentId: { type: string }
        type: { type: string }
        verdict: { type: string }
        score: { type: number }

    CreateAgentEvaluationRequest:
      type: object
      required: [type, criteria]
      properties:
        type: { type: string }
        criteria: { type: object }

    CompleteAgentEvaluationRequest:
      type: object
      required: [verdict, score, notes]
      properties:
        verdict: { type: string }
        score: { type: number }
        notes: { type: string }

    AgentEligibility:
      type: object
      required: [eligible, state, qualified]
      properties:
        eligible: { type: boolean }
        state: { type: string }
        qualified: { type: boolean }

    Task:
      type: object
      required: [id, traceId, agentId, status, createdAt, input]
      properties:
        id: { type: string }
        traceId: { type: string }
        agentId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        input: { type: object }
        output: { type: object }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    CreateTaskRequest:
      type: object
      required: [agentId, input]
      properties:
        agentId: { type: string }
        input: { type: object }
        traceId: { type: string }

    TaskCancellationResult:
      type: object
      required: [taskId, status]
      properties:
