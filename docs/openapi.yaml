    DurableEventListResponse:
      type: object
      required: [events, total, nextSequence]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditObservation' }
        total: { type: integer }
        nextSequence: { type: integer }

    Error:
      type: object
      required: [error, status, code, requestId, correlationId, timestamp]
      properties:
        error: { type: string }
        status: { type: integer }
        code: { type: string }
        requestId: { type: string }
        correlationId: { type: string }
        timestamp: { type: string, format: date-time }
        traceId: { type: string }

  responses:
    BadRequestError:
      description: Bad Request — Schema validation failed or malformed JSON payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnauthorizedError:
      description: Unauthorized — Missing, expired or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ForbiddenError:
      description: Forbidden — Missing permissions, scope or cross-tenant boundary violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFoundError:
      description: Not Found — Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ConflictError:
      description: Conflict — Resource state conflict or duplicate unique identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    RateLimitError:
      description: Too Many Requests — Request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal Server Error — Unhandled platform exception
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Enterprise API Key with 'aop_live_' prefix.
        Validated against SHA-256 hashed credentials table with tenant and scope isolation.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Asymmetric JWT bearer token (RS256 / ES256).
        Subject principal, tenant claim and expiration evaluated fail-closed.
