openapi: 3.1.0
info:
  title: AI Operating Platform REST API
  version: 1.4.0
  description: |
    Official HTTP REST API contract for the AI Operating Platform (AOP).
    Provides deterministic agent coordination, task execution, autonomous operations,
    workflow verification, multi-enterprise governance, credential management, and
    compliance evidence export under a default-deny security model.
  contact:
    name: AI Operating Platform Engineering Team
    url: https://github.com/johangonzahenri/ai-operating-platform
  license:
    name: Proprietary / Enterprise Governed

servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local Platform Server (Default Runtime)
  - url: http://127.0.0.1:3000
    description: Local Root Server (Aliases /api/v1/* and /api/platform/v1/*)

security:
  - apiKeyAuth: []
  - bearerAuth: []

tags:
  - name: Health & Diagnostics
    description: Platform readiness, liveness, telemetry and system status
  - name: Agents
    description: Agent registry, capability discovery, lifecycle transitions and evaluations
  - name: Tasks & Executions
    description: Deterministic task creation, lifecycle transitions and execution observations
  - name: Autonomous Operations
    description: Bounded autonomous runtime, trigger execution and safety breaker controls
  - name: Workflows & Approvals
    description: Multi-step DAG workflows, deterministic verification and segregation of duties
  - name: Solutions
    description: Packaged AI solution blueprints, versions, lifecycle and instances
  - name: Organizations & Budgets
    description: Enterprise organizational hierarchy, teams, resource quotas and agent coordination
  - name: Governance & Portfolios
    description: Multi-enterprise portfolios, mandates, KPI rollups and forensic evidence export
  - name: Credentials & Security
    description: Zero-plaintext API key lifecycle, rotation, revocation and scope enforcement
  - name: Applications & Factory
    description: Satellite application registry, manifest validation and scaffolding factory
  - name: Devices & Hardware
    description: Peripheral business devices, printing spooler and hardware probes
  - name: Spare Parts & Automotive
    description: Automotive parts discovery, deterministic fitment verification and multi-source price comparison

paths:
  /status:
    get:
      tags: [Health & Diagnostics]
      summary: Get platform status
      operationId: getPlatformStatus
      security: []
      responses:
        '200':
          description: Operational status of platform subsystems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStatus'

  /health:
    get:
      tags: [Health & Diagnostics]
      summary: Get system health and component connectivity
      operationId: getPlatformHealth
      security: []
      responses:
        '200':
          description: Comprehensive health check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealth'

  /health/live:
    get:
      tags: [Health & Diagnostics]
      summary: Liveness probe for process supervisors and orchestrators
      operationId: getLivenessProbe
      security: []
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'

  /health/ready:
    get:
      tags: [Health & Diagnostics]
      summary: Readiness probe for traffic routing
      operationId: getReadinessProbe
      security: []
      responses:
        '200':
          description: Platform is ready to accept requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'

  /diagnostics:
    get:
      tags: [Health & Diagnostics]
      summary: Retrieve runtime diagnostics and system telemetry
      operationId: getDiagnostics
      responses:
        '200':
          description: Diagnostics snapshot
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /diagnostics/network:
    get:
      tags: [Health & Diagnostics]
      summary: Retrieve perimeter network topology and security headers status
      operationId: getNetworkDiagnostics
      responses:
        '200':
          description: Network diagnostic report
          content:
            application/json:
              schema:
                type: object

  /diagnostics/tasks/{taskId}/timeline:
    get:
      tags: [Health & Diagnostics]
      summary: Retrieve event timeline for a given task
      operationId: getTaskTimeline
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chronological list of timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditObservation'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /diagnostics/traces/{traceId}:
    get:
      tags: [Health & Diagnostics]
      summary: Reconstruct distributed execution trace
      operationId: getTraceDetails
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace events and spans
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFoundError'

  /platform:
    get:
      tags: [Health & Diagnostics]
      summary: Get platform metadata and supported capabilities
      operationId: getPlatformMetadata
      responses:
        '200':
          description: Platform version and capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMetadata'

  /metrics:
    get:
      tags: [Health & Diagnostics]
      summary: Get aggregated operational metrics
      operationId: getMetrics
      responses:
        '200':
          description: Metric counters and sample counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSummary'

  /capabilities:
    get:
      tags: [Health & Diagnostics]
      summary: List all catalogued platform capabilities
      operationId: listCapabilities
      responses:
        '200':
          description: Platform capability catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformCapability'

  /events:
    get:
      tags: [Health & Diagnostics]
      summary: Query durable audit event log
      operationId: queryEvents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: afterSequence
          in: query
          schema:
            type: integer
        - name: eventType
          in: query
          schema:
            type: string
        - name: traceId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated durable event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DurableEventListResponse'

  /events/stream:
    get:
      tags: [Health & Diagnostics]
      summary: Stream live platform events via Server-Sent Events (SSE)
      operationId: streamEvents
      parameters:
        - name: Last-Event-ID
          in: header
          description: Sequence number of the last received event for automatic replay and reconnection
          required: false
          schema:
            type: integer
        - name: tenantId
          in: query
          description: Filter events by tenant ID (enforces strict tenant isolation)
          required: false
          schema:
            type: string
        - name: applicationId
          in: query
          description: Filter events by application ID
          required: false
          schema:
            type: string
        - name: agentId
          in: query
          description: Filter events by agent ID
          required: false
          schema:
            type: string
        - name: executionId
          in: query
          description: Filter events by execution ID
          required: false
          schema:
            type: string
        - name: traceId
          in: query
          description: Filter events by trace ID
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          description: Filter events by domain event type
          required: false
          schema:
            type: string
        - name: lastEventId
          in: query
          description: Alternative query param for Last-Event-ID
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string

  /tools:
    get:
      tags: [Health & Diagnostics]
      summary: List registered and safe tool definitions
      operationId: listTools
      responses:
        '200':
          description: Active tool catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tool'

  /models:
    get:
      tags: [Health & Diagnostics]
      summary: List available model providers and adapters
      operationId: listModels
      responses:
        '200':
          description: Active LLM adapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'

  /agents:
    get:
      tags: [Agents]
      summary: List registered AI agents
      operationId: listAgents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
    post:
      tags: [Agents]
      summary: Register a new governed AI agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /agents/{id}:
    get:
      tags: [Agents]
      summary: Get details of a registered agent
      operationId: getAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Agents]
      summary: Update agent configuration
      operationId: updateAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Agents]
      summary: Unregister agent
      operationId: deleteAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  /agents/{id}/profile:
    get:
      tags: [Agents]
      summary: Get agent operational profile and capability credentials
      operationId: getAgentProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
    post:
      tags: [Agents]
      summary: Create agent operational profile
      operationId: createAgentProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentProfileRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'

  /agents/{id}/capabilities:
    post:
      tags: [Agents]
      summary: Add capability to agent profile
      operationId: addAgentCapability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCapabilityRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'

  /agents/{id}/lifecycle:
    get:
      tags: [Agents]
      summary: Get agent lifecycle state and qualification status
      operationId: getAgentLifecycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLifecycle'

  /agents/{id}/lifecycle/transition:
    post:
      tags: [Agents]
      summary: Transition agent lifecycle state
      operationId: transitionAgentLifecycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionLifecycleRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLifecycle'

  /agents/{id}/evaluations:
    get:
      tags: [Agents]
      summary: List performance evaluations for agent
      operationId: listAgentEvaluations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentEvaluation'
    post:
      tags: [Agents]
      summary: Create evaluation request for agent
      operationId: createAgentEvaluation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentEvaluationRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEvaluation'

  /agents/{id}/evaluations/{evalId}/complete:
    post:
      tags: [Agents]
      summary: Complete agent evaluation with verdict
      operationId: completeAgentEvaluation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: evalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAgentEvaluationRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEvaluation'

  /agents/{id}/eligibility:
    get:
      tags: [Agents]
      summary: Check if agent is eligible for autonomous execution
      operationId: checkAgentEligibility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEligibility'

  /tasks:
    get:
      tags: [Tasks & Executions]
      summary: List all tasks with optional status and pagination
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      tags: [Tasks & Executions]
      summary: Submit a new task for governed execution
      operationId: createTask
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task accepted and scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /tasks/{id}:
    get:
      tags: [Tasks & Executions]
      summary: Get task details by ID
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details and execution status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tasks/{id}/cancel:
    post:
      tags: [Tasks & Executions]
      summary: Cancel an in-flight task
      operationId: cancelTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCancellationResult'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tasks/{id}/execute:
    post:
      tags: [Tasks & Executions]
      summary: Execute an existing task synchronously
      operationId: executeTaskDirect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'

  /executions/{id}:
    get:
      tags: [Tasks & Executions]
      summary: Get execution details and tool call observations
      operationId: getExecution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /orchestrate:
    post:
      tags: [Tasks & Executions]
      summary: Execute multi-operation sequence with DAG bindings
      operationId: orchestrateOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationRequest'
      responses:
        '200':
          description: Orchestration execution outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationResult'

  /operations:
    get:
      tags: [Autonomous Operations]
      summary: List autonomous operations
      operationId: listOperations
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutonomousOperation'
    post:
      tags: [Autonomous Operations]
      summary: Start a new bounded autonomous operation
      operationId: startOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOperationRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousOperation'

  /operations/{id}:
    get:
      tags: [Autonomous Operations]
      summary: Get autonomous operation details
      operationId: getOperation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousOperation'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /operations/{id}/pause:
    post:
      tags: [Autonomous Operations]
      summary: Pause an active autonomous operation
      operationId: pauseOperation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousOperation'

  /operations/{id}/resume:
    post:
      tags: [Autonomous Operations]
      summary: Resume a paused autonomous operation
      operationId: resumeOperation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousOperation'

  /operations/{id}/cancel:
    post:
      tags: [Autonomous Operations]
      summary: Cancel an autonomous operation
      operationId: cancelOperation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousOperation'

  /autonomous/runtime:
    get:
      tags: [Autonomous Operations]
      summary: Get autonomous daemon status and lease state
      operationId: getAutonomousRuntimeState
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousRuntimeState'

  /autonomous/runtime/start:
    post:
      tags: [Autonomous Operations]
      summary: Start the continuous autonomous operations daemon
      operationId: startAutonomousRuntime
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousRuntimeState'

  /autonomous/runtime/stop:
    post:
      tags: [Autonomous Operations]
      summary: Stop the autonomous operations daemon
      operationId: stopAutonomousRuntime
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousRuntimeState'

  /autonomous/triggers:
    get:
      tags: [Autonomous Operations]
      summary: List registered autonomous triggers
      operationId: listAutonomousTriggers
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutonomousTrigger'
    post:
      tags: [Autonomous Operations]
      summary: Register a new autonomous trigger
      operationId: createAutonomousTrigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutonomousTriggerRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousTrigger'

  /autonomous/triggers/{id}/fire:
    post:
      tags: [Autonomous Operations]
      summary: Manually fire an autonomous trigger
      operationId: fireAutonomousTrigger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousOperation'

  /workflows:
    get:
      tags: [Workflows & Approvals]
      summary: List defined workflows
      operationId: listWorkflows
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDefinition'
    post:
      tags: [Workflows & Approvals]
      summary: Create a new DAG workflow definition
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'

  /workflows/{id}:
    get:
      tags: [Workflows & Approvals]
      summary: Get workflow definition
      operationId: getWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
    put:
      tags: [Workflows & Approvals]
      summary: Update workflow definition
      operationId: updateWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'

  /workflows/{id}/activate:
    post:
      tags: [Workflows & Approvals]
      summary: Activate a draft workflow definition
      operationId: activateWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'

  /workflows/{id}/start:
    post:
      tags: [Workflows & Approvals]
      summary: Start an instance of an active workflow
      operationId: startWorkflowInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkflowRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'

  /workflows/instances/{id}:
